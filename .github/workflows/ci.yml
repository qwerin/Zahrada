name: CI

# push do main      → testy → image ghcr.io/<repo>:main + :sha-xxxxxxx → redeploy dev stacku
# tag v1.2.3        → testy → image :1.2.3 + :1.2 + :latest            → redeploy produkce
# pull request      → jen testy a zkušební build image (bez push)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-backend:
    name: Go testy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Testy
        run: go test ./... -count=1
        env:
          CGO_ENABLED: "0"

      - name: Kontrola zranitelností
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  test-frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - name: Typecheck
        run: npm run typecheck
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web

  image:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Krátký hash commitu
        id: git
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Přihlášení do GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tagy image
        id: meta
        uses: docker/metadata-action@v6
        with:
          # GHCR vyžaduje malá písmena (repo se jmenuje qwerin/Zahrada)
          images: ghcr.io/${{ github.repository_owner }}/zahrada
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build a push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}+${{ steps.git.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Webhook stacku v Portaineru (Stack → GitOps updates → Webhook, zapnout „Re-pull image“
      # a „Force redeployment“). URL ulož do secrets repozitáře; bez něj se krok přeskočí.
      - name: Redeploy v Portaineru
        if: github.event_name == 'push'
        env:
          HOOK: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.PORTAINER_WEBHOOK_PROD || secrets.PORTAINER_WEBHOOK_DEV }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "Webhook Portaineru není nastavený — přeskakuji (stack lze aktualizovat ručně)."
            exit 0
          fi
          curl -fsS -X POST --retry 3 --retry-delay 5 "$HOOK"
          echo "Redeploy spuštěn."
